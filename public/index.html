<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalasi Saver - Smart Budget Tracker</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a2e40">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dalasi Saver">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .app-header {
            background: #1a2e40;
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        .app-logo {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .app-header p {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 4px;
        }

        .content-body {
            padding: 24px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .saved-banner {
            display: none;
            background: #ebf8ff;
            border: 2px solid #3182ce;
            border-radius: 14px;
            padding: 14px 16px;
            flex-direction: column;
            gap: 10px;
        }

        .saved-banner.negative {
            background: #fff5f5;
            border-color: #e53e3e;
        }

        .saved-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .saved-info small {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
        }

        .saved-info strong {
            font-size: 20px;
            color: #1a2e40;
            letter-spacing: 0.5px;
        }

        .saved-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding-top: 8px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            user-select: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e0;
            transition: 0.25s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.25s;
            border-radius: 50%;
        }

        .switch input:checked + .slider {
            background-color: #2b8a3e;
        }

        .switch input:checked + .slider:before {
            transform: translateX(18px);
        }

        .btn-reset {
            background: #ffffff;
            border: 1px solid #cbd5e0;
            color: #4a5568;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
        }

        .row-box {
            display: flex;
            gap: 12px;
            background: #edf2f7;
            padding: 12px;
            border-radius: 12px;
        }

        .row-box .input-group {
            flex: 1;
        }

        .row-box .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #2b8a3e;
        }

        .wave-section {
            background: #f7fafc;
            border: 2px dashed #0098ea;
            border-radius: 14px;
            padding: 16px;
            margin-top: 5px;
        }

        .wave-section label {
            color: #0098ea;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .wave-textarea {
            width: 100%;
            height: 70px;
            margin-top: 8px;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 13px;
            resize: none;
            outline: none;
        }

        .wave-status {
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            min-height: 16px;
        }

        .btn-primary {
            width: 100%;
            background: #2b8a3e;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(43, 138, 62, 0.2);
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #237032;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-sheet {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 30px 24px;
            box-shadow: 0 -4px 25px rgba(0,0,0,0.15);
            max-height: 88vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a2e40;
        }

        .close-btn {
            font-size: 24px;
            color: #a0aec0;
            cursor: pointer;
            border: none;
            background: none;
        }

        .metrics-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: #f7fafc;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #2b8a3e;
        }

        .metric-card.rice-card {
            background: #fffaf0;
            border-left-color: #dd6b20;
        }

        .metric-label {
            font-size: 14px;
            color: #718096;
            font-weight: 500;
        }

        .metric-val {
            font-size: 18px;
            font-weight: 700;
            color: #1a2e40;
        }

        .save-prompt-box {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .save-prompt-box p {
            font-size: 13px;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .prompt-actions {
            display: flex;
            gap: 10px;
        }

        .btn-save {
            flex: 1;
            background: #1a2e40;
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background: #edf2f7;
            color: #4a5568;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="app-header">
